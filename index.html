<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600;700&family=Pinyon+Script&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --hover:#F6F5F3; --line:#E8E6E1; --line2:#F0EEEA;
  --text:#1C1917; --muted:#78716C; --faint:#A8A29E;
  --accent:#1C1917; --gold:#A6814A; --goldSoft:#F6EFE2;
  --good:#2F6B45; --goodSoft:#E8F2EB; --bad:#B42318; --badSoft:#FDECEA;
  --serif:'Cormorant Garamond', Didot, Georgia, serif;
  --script:'Pinyon Script',cursive; --arabic:'Amiri',serif;
  --sans:'Figtree', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:flex;min-height:100vh}
aside{width:236px;flex:none;border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:16px;background:#fff}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;border-bottom:1px solid var(--line)}
.logo i{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#D9BF8E;font-style:normal;font-family:var(--serif);font-size:19px;flex:none}
.logo b{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.1}
.logo small{display:block;font-size:12px;color:var(--muted);font-family:var(--sans)}
nav{display:flex;flex-direction:column;gap:1px}
nav .grp{font-size:11.5px;color:var(--faint);padding:12px 10px 4px}
nav button{border:none;background:none;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;text-align:left;min-height:38px;display:flex;align-items:center;gap:8px}
nav button:hover{background:var(--hover);color:var(--text)}
nav button[aria-current="page"]{background:var(--hover);color:var(--text)}
nav .badge{margin-left:auto;font-size:11.5px;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.who{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px;display:flex;align-items:center;gap:8px;word-break:break-all}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.live{background:var(--good)}
.mob{display:none}
.wrap{flex:1;min-width:0}
main{max-width:1160px;padding:32px 36px 72px}
.ph{margin-bottom:22px}
.ph h1{margin:0;font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.1}
.ph p{margin:4px 0 0;color:var(--muted)}
h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 12px}
h3{font-size:14px;font-weight:600;margin:0 0 6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.sec{margin-top:32px}
.card{border:1px solid var(--line);border-radius:10px;padding:18px;background:#fff}
.kpi{display:flex;flex-direction:column-reverse;gap:6px}
.kpi .n{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;min-height:40px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.solid:hover{background:#000}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}
.x{border:none;background:none;min-width:40px;min-height:40px;border-radius:8px;color:var(--faint)}
.x:hover{color:var(--bad);background:var(--badSoft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=number],input[type=date],select{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
input:focus,select:focus{border-color:var(--text);outline:none}
.form{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.form .wide{grid-column:span 2}
.hint{font-size:12.5px;color:var(--muted);grid-column:1/-1;margin-top:-4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--hover)}
tr:last-child td{border-bottom:none}
td input,td select{min-height:34px;padding:5px 8px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--hover);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--goodSoft);color:var(--good)} .pill.bad{background:var(--badSoft);color:var(--bad)} .pill.gold{background:var(--goldSoft);color:#7A5A2A}
.meter{height:6px;border-radius:999px;background:var(--line2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.hbar{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;min-height:30px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.banner{background:var(--goldSoft);color:#5E4520;border-radius:10px;padding:12px 16px;font-size:13.5px;margin-bottom:20px}
.auth{max-width:420px;margin:12vh auto;padding:0 20px;text-align:center}
.auth h1{font-family:var(--serif);font-weight:500;font-size:40px;margin:0 0 6px}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff}
.task input{width:20px;height:20px;margin-top:2px;accent-color:#1C1917;flex:none}
.task.done{background:var(--hover);border-color:transparent}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.tt{font-weight:600}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px;align-items:baseline}
.feed div:last-child{border-bottom:none}
.feed time{color:var(--faint);font-size:12.5px;white-space:nowrap;min-width:74px}
.av{width:24px;height:24px;border-radius:50%;background:var(--goldSoft);color:#7A5A2A;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.note{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:14px}
.note:last-child{border-bottom:none}
.note b.flag{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.flag.r{background:var(--bad)}.flag.a{background:var(--gold)}.flag.g{background:var(--good)}.flag.i{background:var(--faint)}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ig button{aspect-ratio:4/5;border:none;padding:6px;display:flex;align-items:flex-end;font-size:10px;line-height:1.25;text-align:left;color:#F6EDE2;position:relative}
.ig button[aria-pressed="true"]{outline:3px solid #A6814A;outline-offset:-3px}
.ig .t{position:absolute;top:6px;left:6px;font-weight:600;opacity:.9}
.phone{width:320px;max-width:100%;border:1px solid var(--line);border-radius:28px;padding:18px 14px;margin:0 auto}
.tabs{display:inline-flex;gap:2px;flex-wrap:wrap;margin-bottom:16px;background:var(--line2);padding:3px;border-radius:10px}
.tab{border:none;background:transparent;border-radius:8px;padding:7px 14px;min-height:36px;font-size:13.5px;font-weight:500;color:var(--muted)}
.tab[aria-pressed="true"]{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:72px;resize:vertical}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:860px){
  .app{display:block}
  aside{display:none}
  .mob{display:block;position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:10px 0 0}
  .mob .top{display:flex;align-items:center;gap:10px;padding:0 16px 8px}
  .mob .logo{border:none;padding:0}
  .mob nav{flex-direction:row;overflow-x:auto;padding:0 10px 10px;scrollbar-width:none}
  .mob nav .grp{display:none}
  .mob nav button{white-space:nowrap;flex:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
  .mob{top:env(safe-area-inset-top,0px)}
  main{padding:22px 16px 60px}
  .g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:minmax(0,1fr)}
  .form .wide{grid-column:span 1}
  .kpi .n{font-size:24px}
  .hbar{grid-template-columns:110px 1fr 76px}
}
</style>
</head>
<body>
<div id="app"><div class="auth"><p class="muted">Loading…</p></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
